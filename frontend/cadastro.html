<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Projeto CRUD</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="topo">
        <a class="marca" href="index.html">
            CATÁLOGO<span>.</span>
        </a>

        <nav>
            <a href="index.html">Produtos</a>
            <a class="botao botao-pequeno" href="cadastro.html">+ Novo produto</a>
        </nav>
    </header>

    <main class="container container-formulario">
        <a class="voltar" href="index.html">← Voltar para produtos</a>

        <section class="cabecalho-pagina">
            <p class="etiqueta">FORMULÁRIO</p>
            <h1 id="tituloFormulario">Cadastrar produto</h1>
            <p class="subtitulo">
                Preencha os campos para adicionar um item ao catálogo.
            </p>
        </section>

        <p id="mensagem"></p>

        <form id="formProduto" class="cartao formulario">
            <div class="grade-formulario">
                <div class="campo campo-largo">
                    <label for="nome">Nome do produto</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Ex.: Fone sem fio"
                    >
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" name="categoria">
                        <option value="">Selecione</option>
                        <option value="Tecnologia">Tecnologia</option>
                        <option value="Periféricos">Periféricos</option>
                        <option value="Acessórios">Acessórios</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="preco">Preço (R$)</label>
                    <input
                        type="number"
                        id="preco"
                        name="preco"
                        placeholder="0,00"
                        min="0"
                        step="0.01"
                    >
                </div>

                <div class="campo">
                    <label for="estoque">Quantidade em estoque</label>
                    <input
                        type="number"
                        id="estoque"
                        name="estoque"
                        placeholder="Ex.: 20"
                        min="0"
                        step="1"
                    >
                </div>

                <div class="campo">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="">Selecione</option>
                        <option value="Disponível">Disponível</option>
                        <option value="Indisponível">Indisponível</option>
                    </select>
                </div>

                <div class="campo campo-largo">
                    <label for="descricao">Descrição</label>
                    <textarea
                        id="descricao"
                        name="descricao"
                        rows="4"
                        placeholder="Escreva uma descrição curta"
                    ></textarea>
                </div>
            </div>

            <div class="acoes-formulario">
                <a class="botao botao-neutro" href="index.html">Cancelar</a>
                <button class="botao" id="botaoSalvar" type="submit">
                    Salvar produto
                </button>
            </div>
        </form>
    </main>

    <footer>
        <p>Projeto CRUD · Front-end preparado para integração com Express</p>
    </footer>

    <script src="cadastro.js"></script>
</body>

</html>
